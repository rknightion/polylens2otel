version: 2
project_name: polylens2otel
report_sizes: true
gomod:
  proxy: true
builds:
  - id: polylens2otel
    main: ./cmd/polylens2otel
    binary: polylens2otel
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/rknightion/polylens2otel/internal/version.Version={{ .Version }}
      - -X github.com/rknightion/polylens2otel/internal/version.Commit={{ .Commit }}
      - -X github.com/rknightion/polylens2otel/internal/version.BuildDate={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
sboms:
  - artifacts: archive
changelog:
  use: github
  sort: asc
