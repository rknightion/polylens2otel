# Weekly GHCR retention. Keeps every stable release forever, the newest 10 RCs,
# 7 days of main-<sha> edge images and 30 days of 0.0.0-main.* dev charts;
# sweeps orphaned cosign signatures and stale buildcache layers.
#
# Replaces a bespoke github-script implementation that could never delete
# anything: it read its kill switch from `inputs.delete`, and a scheduled run
# has no inputs, so every weekly run fell back to a dry run. It also only
# considered untagged manifests older than 30 days, so buildcache layers, edge
# images, RCs and dev chart versions were all out of its reach.
name: ghcr-cleanup

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would be deleted without deleting it."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Never cancel a retention sweep halfway through; serialize overlapping runs.
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  prune:
    permissions:
      contents: read
      packages: write # delete package versions
    uses: rknightion/.github/.github/workflows/ghcr-cleanup.yml@4d749e93fb2ba8ae3d213c21686bc7ac204bb928 # v1.23.0
    with:
      packages: "polylens2otel,charts/polylens2otel"
      # Scheduled runs prune for real; a manual dispatch defaults to dry-run.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
