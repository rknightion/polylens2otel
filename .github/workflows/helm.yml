name: Helm

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
  # This required check must report for every PR; path filters here would leave
  # unrelated PRs blocked waiting for a check that was never created.
  pull_request:

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_DIR: charts/polylens2otel

jobs:
  lint-template:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: helm lint "$CHART_DIR"
      - name: helm template
        run: helm template polylens2otel "$CHART_DIR" > /dev/null
      - name: helm-docs README is in sync
        run: |
          just docs
          git diff --exit-code "$CHART_DIR/README.md"

  # This chart published to GHCR with no schema validation against the real
  # Kubernetes API schemas at all — `lint-template` above only ran helm's own
  # lint plus a bare template render, never a kubeconform check. No kubeVersion
  # floor is declared in Chart.yaml, so this validates against the reusable's
  # own default floor (1.29.0). No named `helm template` variant exists
  # anywhere in this repo, so only the bare default render is validated.
  helm-schema-validate:
    name: helm schema validate (kubeconform)
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/helm-validate.yml@1ee56349bfcf2568e538479918b9bdd1b9196309 # v1.15.1
    with:
      chart-path: charts/polylens2otel
      kubernetes-versions: "1.29.0"

  helm-success:
    name: helm-success
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-template, helm-schema-validate]
    steps:
      - name: Fail if the required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required job failed or was cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All required jobs passed
        run: echo "helm-success — ${{ join(needs.*.result, ', ') }}"
