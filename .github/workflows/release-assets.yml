name: Release assets

# Recovery path for a partially published release. This deliberately rebuilds
# binaries from the immutable release tag; normal releases still flow through
# release-please.yml.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  binaries:
    name: release binaries
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    uses: rknightion/.github/.github/workflows/binaries.yml@d6da1febca63ae05fcefa8b90486d75cef89517e # v1.25.21
    with:
      release-tag: ${{ inputs.release_tag }}
      install-cosign: true
      goreleaser-args: "release --clean --skip=docker"
      pre-cmd: "bash .github/scripts/install-syft.sh"
