# Code generated by internal/configdoc; DO NOT EDIT. Run `make regen`.
# Defaults < YAML < PL2O_ environment variables. Secrets are intentionally omitted:
# use their listed PL2O_ variables, because the loader rejects secrets in YAML.
log:
  # Application log level.
  level: "info"
  # Application log encoding.
  format: "json"
lens:
  # OAuth token endpoint for Poly Lens.
  token_url: "https://login.lens.poly.com/oauth/token"
  # Poly Lens GraphQL endpoint.
  graphql_url: "https://api.silica-prod01.io.lens.poly.com/graphql"
  # Poly Lens GraphQL WebSocket endpoint for deviceStream.
  websocket_url: "wss://api.silica-prod01.io.lens.poly.com/graphql"
  # OAuth client identifier.
  client_id: ""
  # lens.client_secret is secret; set PL2O_LENS__CLIENT_SECRET in the environment.
  # Lens tenant IDs to collect. An empty list discovers tenants through the read-only tenants query.
  tenants: []
  # Lens page size; validation permits 1 through 5000. Keep the value stable across follow-up pages.
  page_size: 10
  # Timeout for an individual Lens request.
  request_timeout: 30s
  retry:
    # Maximum Lens request attempts, including the first attempt.
    max_attempts: 4
    # Initial Lens retry backoff.
    min_backoff: 1s
    # Maximum Lens retry backoff.
    max_backoff: 30s
  stream:
    # Enable the named deviceStream GraphQL subscription as an edge-triggered supplement to polling.
    enabled: true
    # Time allowed for a deviceStream acknowledgement.
    ack_timeout: 10s
    # Initial deviceStream reconnect backoff.
    min_backoff: 1s
    # Maximum deviceStream reconnect backoff.
    max_backoff: 1m0s
phone:
  # Enable phone REST collectors. When enabled, phone.auth.password is required.
  enabled: true
  # Static per-device targets. Each <device-id> overrides that device's Lens internalIp; discovery never scans.
  targets:
    <device-id>: phone.example.invalid
  # Read-only phone configuration parameters requested by the phone config collector; at most 50 to bound the phone response and resulting metric-series count.
  config_params: ["reg.1.address", "reg.2.address", "reg.1.label", "device.syslog.serverName", "tcpIpApp.sntp.address", "softkey.1.enable"]
  # Timeout for an individual phone REST request.
  request_timeout: 15s
  auth:
    # Digest authentication username; Polycom is the default.
    username: "Polycom"
    # phone.auth.password is secret; set PL2O_PHONE__AUTH__PASSWORD in the environment.
    # Prefer credentials from the selected Lens policy; defaults to true. Set false to use only the configured password.
    from_lens_policy: true
  tls:
    # Verify the phone TLS certificate chain.
    verify_chain: false
    # Optional CA certificate file for phone TLS verification. The certificate CN must match the Lens MAC before credentials are sent.
    ca_file: ""
collectors:
  # Polling interval for Lens device inventory.
  lens_devices: 1m0s
  # Polling interval for Lens active calls.
  lens_active_calls: 1m0s
  # Polling interval for Lens firmware inventory.
  lens_firmware: 24h0m0s
  # Polling interval for Lens CDR logs.
  lens_cdr: 1h0m0s
  # Polling interval for phone status.
  phone_status: 1m0s
  # Polling interval for phone lines.
  phone_lines: 1m0s
  # Polling interval for phone configuration.
  phone_config: 5m0s
  # Polling interval for phone call logs.
  phone_call_logs: 5m0s
  # Polling interval for phone network information.
  phone_network_info: 5m0s
  # Emission interval for exporter self-observability.
  selfobs_internal: 1m0s
otlp:
  # OTLP collector endpoint.
  endpoint: ""
  # OTLP transport protocol; validation permits http or grpc.
  protocol: "http"
  # Allow an insecure OTLP transport.
  insecure: false
  # OTLP metric export interval.
  export_interval: 15s
  grafana_cloud:
    # Grafana Cloud instance ID.
    instance_id: ""
    # otlp.grafana_cloud.token is secret; set PL2O_OTLP__GRAFANA_CLOUD__TOKEN in the environment.
profiling:
  pyroscope:
    # Pyroscope endpoint. Empty leaves profiling endpoint unset.
    endpoint: ""
    # Pyroscope application name.
    application: "polylens2otel"
    # Pyroscope basic-auth username.
    basic_auth_user: ""
    # profiling.pyroscope.basic_auth_password is secret; set PL2O_PROFILING__PYROSCOPE__BASIC_AUTH_PASSWORD in the environment.
state:
  # Directory for durable collector state; required and must be writable by the exporter.
  dir: "/var/lib/polylens2otel"
cardinality:
  # Maximum devices represented by the exporter; must be positive.
  max_devices: 500
